<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Race</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="screen">
        <div class="lobby-container">
            <h1 class="glow-title">LAN RACE</h1>
            
            <div class="lobby-panels">
                <!-- Left Panel: Profile & Settings -->
                <div class="panel profile-panel">
                    <h2>Your Profile</h2>
                    <input type="text" id="username" placeholder="Username" maxlength="15">
                    <div class="team-picker">
                        <label style="margin-bottom:10px; display:block;">Team</label>
                        <div id="team-grid"></div>
                    </div>
                    

                    <label class="graphics-picker">Graphics:
                        <select id="graphics-select">
                            <option value="auto" selected>Auto</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                        <small id="graphics-note"></small>
                    </label>

                    <button id="btn-join" class="btn primary">Join Lobby</button>
                    
                    <div id="player-controls" class="hidden">
                        <button id="btn-ready" class="btn">Ready Up</button>
                        
                        <div id="host-settings" class="hidden">
                            <h3>Host Settings</h3>
                            <label>Track:
                                <select id="setting-track">
                                    <option value="monza">Monza</option>
                                    <option value="spa">Spa-Francorchamps</option>
                                    <option value="silverstone">Silverstone</option>
                                    <option value="suzuka">Suzuka</option>
                                    <option value="sakhir">Bahrain (Sakhir)</option>
                                </select>
                            </label>
                            <label>Laps:
                                <input type="number" id="setting-laps" min="1" max="50" value="3">
                            </label>
                            <label>Qualifying:
                                <select id="setting-quali">
                                    <option value="1" selected>On (out-lap + 2 laps)</option>
                                    <option value="0">Off</option>
                                </select>
                            </label>
                            <button id="btn-start" class="btn success mt-1">Start Race</button>
                        </div>
                    </div>
                </div>

                <!-- Middle Panel: Players -->
                <div class="panel players-panel">
                    <h2>Players</h2>
                    <ul id="players-list">
                        <!-- Filled by JS -->
                    </ul>
                </div>

                <!-- Right Panel: Chat -->
                <div class="panel chat-panel">
                    <h2>Lobby Chat</h2>
                    <div id="chat-messages"></div>
                    <form id="chat-form">
                        <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
                        <button type="submit" class="btn small">Send</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen hidden">
        <canvas id="game-canvas"></canvas>
        
        <!-- HUD -->
        <div id="hud">
            <div id="hud-top">
                <div class="hud-box">Pos: <span id="hud-rank">1</span>/<span id="hud-total">1</span></div>
                <div class="hud-box">Lap: <span id="hud-lap">1</span></div>
            </div>
            <div id="hud-bottom">
                <div id="lap-times">
                    <div class="lt-row lt-now"><span class="lt-label">LAP</span><span id="lt-current">--</span></div>
                    <div class="lt-row"><span class="lt-label">LAST</span><span id="lt-delta"></span><span id="lt-last">--</span></div>
                    <div class="lt-row"><span class="lt-label">BEST</span><span id="lt-best">--</span></div>
                    <div id="sector-panel">
                        <div class="sec" id="sec-1"><i></i><span>S1</span></div>
                        <div class="sec" id="sec-2"><i></i><span>S2</span></div>
                        <div class="sec" id="sec-3"><i></i><span>S3</span></div>
                    </div>
                </div>
                <div id="drs-badge" class="drs-off" title="DRS — press E (gamepad Y) when green">DRS</div>
                <div class="hud-speedometer"><span id="hud-speed">0</span> KM/H</div>
            </div>
            
            <canvas id="minimap" width="220" height="220"></canvas>
            <div id="session-bar"></div>
            <div id="pit-limiter" class="hidden">PIT LIMITER 80</div>
            <div id="sector-flash" class="hidden"></div>
            <div id="race-msg" class="hidden"></div>
            <div id="lights" class="hidden">
                <span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span>
            </div>

            <!-- Leaderboard (top right) -->
            <div id="leaderboard">
                <div id="tt-head" title="Press T or tap to switch"><span>TIMING</span><span id="tt-mode">INTERVAL</span></div>
                <ol id="leaderboard-list"></ol>
            </div>
        </div>

        <div id="joystick-zone">
            <div id="joystick-base">
                <div id="joystick-knob"></div>
            </div>
        </div>

        <div id="countdown-overlay" class="hidden">
            <h1 id="countdown-text">3</h1>
        </div>
        
        <div id="spectator-overlay" class="hidden">
            <h2>SPECTATING</h2>
            <p>Race in progress · ← → to switch car</p>
        </div>

        <div id="quali-results" class="hidden">
            <h2>QUALIFYING RESULTS</h2>
            <ol id="quali-results-list"></ol>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/socket.js"></script>
    <script src="js/app.js"></script>
    <script type="module" src="js/game3d.js"></script>
</body>
</html>
